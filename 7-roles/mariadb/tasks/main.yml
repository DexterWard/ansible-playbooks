---
# tasks file for mariadb
- name: Instalar {{software}}
  ansible.builtin.apt:
    name: "{{software}}"
    state: present
  when: ansible_facts['distribution'] | lower == 'ubuntu'

- name: Arrancar el servicio {{servicio}}
  ansible.builtin.service:
    name: "{{servicio}}"
    state: started
  when: ansible_facts['distribution'] | lower == 'ubuntu'
  notify:
    - copiar_script_sql
    - crear_bd
