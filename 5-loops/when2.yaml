---
- name: Prueba con WHEN, visualizar fecha en los ubuntu
  hosts: all

  tasks:

  - name: Ver variables FACT
    debug:
      msg: "La distribucion es {{ansible_facts['distribution']}}"

  - name: Capturar fecha
    shell:
      cmd: date
    register: fecha
    when: ansible_facts['distribution']=='Ubuntu' or ansible_facts['distribution']=='Rocky'

  - name: Visualizar fecha
    ansible.builtin.debug:
      msg: "{{fecha.stdout}}"
    when: ansible_facts['distribution']=='Ubuntu' or ansible_facts['distribution']=='Rocky'
